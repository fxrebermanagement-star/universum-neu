<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#090614">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Universum">
<meta name="description" content="Universum Neu — Rituale, Mond, Karten, Sigille, Chronik">
<title>Universum Neu</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="assets/icon.svg">
<link rel="apple-touch-icon" href="assets/icon.svg">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div class="app">
<header>
  <div id="headRow">
    <div id="moonWrap" title="Mond">
      <span id="moonSym" aria-hidden="true"></span>
      <span id="moonTxt"></span>
    </div>
    <img class="doll" src="assets/rune.svg" alt="" aria-hidden="true" width="54" height="54">
    <button type="button" id="sunWrap" title="Festtag anzeigen" aria-label="Festtag anzeigen">
      <span id="sunSym" aria-hidden="true"></span>
      <span id="sunTxt"></span>
    </button>
  </div>
  <p class="brand">UNIVERSUM NEU</p>
  <p id="appVer"></p>
</header>

<main>
  <section class="screen on" id="home" aria-label="Start">
    <div id="festHint"></div>
    <div id="kasten">
      <div class="duo">
        <div id="kOut" aria-label="Tageskarte"></div>
        <div id="sigilBox" aria-label="Sigille">
          <canvas id="sigilC" width="360" height="360" aria-label="Sigil-Zeichnung"></canvas>
        </div>
      </div>
      <div id="tools">
        <button type="button" class="tile t1" id="kTag" aria-label="Tageskarte neu"><b>✦</b><span>Karte</span></button>
        <button type="button" class="tile t2" id="kDrei" aria-label="Drei Karten"><b>☰</b><span>Drei</span></button>
        <button type="button" class="tile t3" id="zahlFocus" aria-label="369 Zähler" onclick="document.getElementById('z369')?.scrollIntoView({behavior:'smooth'})"><b>369</b><span>Zähler</span></button>
        <button type="button" class="tile t4" id="sigilGo" aria-label="Sigil zeichnen"><b>✽</b><span>Zeichen</span></button>
      </div>
      <div id="sigRow">
        <label class="lbl visually-hidden" for="sigilT">Absicht</label>
        <input id="sigilT" placeholder="Absicht" autocomplete="off" aria-label="Absicht für Sigille">
        <button type="button" class="btn ghost" id="sigilSave">Ablegen</button>
      </div>
      <div id="z369" class="z369" aria-label="369 Zähler"></div>
    </div>
    <div id="cats" role="tablist" aria-label="Kategorien"></div>
    <div id="list"></div>
  </section>

  <section class="screen" id="drei" aria-label="Drei Karten">
    <div class="hero"><h2>Drei Karten</h2><p class="sub">Lage · Block · Weg</p></div>
    <div id="dreiList"></div>
    <div class="row"><button type="button" class="btn ghost" id="dreiBack">Zurück</button></div>
  </section>

  <section class="screen" id="run" aria-label="Ritual"></section>

  <section class="screen" id="geplant" aria-label="Geplant">
    <div class="hero"><h2>Geplant</h2></div>
    <div class="card" style="cursor:default">
      <label class="lbl" for="plR">Ritual</label>
      <select id="plR"></select>
      <label class="lbl" for="plW">Für wen</label>
      <input id="plW" placeholder="Name oder A · B" autocomplete="off">
      <div class="row"><button type="button" class="btn primary" id="plAdd">Vormerken</button></div>
    </div>
    <div id="plList"></div>
  </section>

  <section class="screen" id="notiz" aria-label="Notiz">
    <div class="hero"><h2>Notiz</h2></div>
    <div class="card" style="cursor:default">
      <label class="lbl" for="noteT">Neue Notiz</label>
      <textarea id="noteT" placeholder="Neue Notiz"></textarea>
      <div class="row"><button type="button" class="btn primary" id="noteAdd">Speichern</button></div>
    </div>
    <div id="notesOnly"></div>
  </section>

  <section class="screen" id="log" aria-label="Chronik">
    <div class="hero"><h2>Chronik</h2></div>
    <div class="row bakBar">
      <button type="button" class="btn ghost" id="bakOut">Sichern (JSON)</button>
      <label class="btn ghost" for="bakIn" style="display:flex;align-items:center;justify-content:center;cursor:pointer;margin:0">Einfügen</label>
      <input type="file" id="bakIn" accept="application/json,.json" hidden aria-label="Sicherung importieren">
    </div>
    <div id="entries"></div>
  </section>

  <section class="screen" id="gabe" aria-label="Gabe">
    <div class="hero"><h2>Gabe</h2><p class="sub">Wort und optional Foto — landet in der Chronik.</p></div>
    <div class="card" style="cursor:default">
      <label class="lbl" for="opferT">Was du gibst</label>
      <textarea id="opferT" placeholder="Was du gibst. Für wen. Warum."></textarea>
      <div id="opferPrev" class="shots"></div>
      <div class="row">
        <button type="button" class="btn ghost" id="opferFoto">Foto</button>
        <button type="button" class="btn primary" id="opferGo">Ablegen</button>
      </div>
      <p class="msg" id="opferMsg" role="status"></p>
    </div>
  </section>

  <section class="screen" id="buch" aria-label="Buch">
    <div class="hero"><h2>Buch</h2></div>
    <article class="card book" id="page" style="cursor:default"></article>
  </section>

  <section class="screen" id="after" aria-label="Abschluss">
    <div class="after-hero">
      <p class="brand">SO SEI ES</p>
      <p class="sub">Die Arbeit ist dem Feld übergeben.</p>
    </div>
    <div class="row">
      <button type="button" class="btn primary" id="afterGo">Fertig</button>
    </div>
    <div class="row">
      <button type="button" class="btn ghost" id="afterStay">Zur Liste</button>
    </div>
  </section>
</main>

<nav aria-label="Hauptnavigation">
  <button type="button" class="on" data-v="home">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l1.2 3.6L17 8l-3.8 1.4L12 13l-1.2-3.6L7 8l3.8-1.4z"/><path d="M8 16h8M9 19h6"/></svg>
    Rituale
  </button>
  <button type="button" data-v="geplant">
    <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="5" width="16" height="15" rx="2"/><path d="M8 3v4M16 3v4M4 10h16"/></svg>
    Geplant
  </button>
  <button type="button" data-v="notiz">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4h8l5 5v11H7z"/><path d="M15 4v5h5M9 13h6M9 17h4"/></svg>
    Notiz
  </button>
  <button type="button" data-v="log">
    <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8"/><path d="M12 8v5l3 2"/></svg>
    Chronik
  </button>
  <button type="button" data-v="gabe">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4l2.2 4.6L19 10l-4.8 1.8L12 17l-2.2-5.2L5 10l4.8-1.4z"/><path d="M7 19h10"/></svg>
    Gabe
  </button>
  <button type="button" data-v="buch">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 5h11a3 3 0 013 3v12H8a3 3 0 01-3-3V5z"/><path d="M8 20a3 3 0 01-3-3"/></svg>
    Buch
  </button>
</nav>
</div>
<style>.visually-hidden{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);border:0}</style>
<script type="module" src="js/app.js"></script>
</body>
</html>
